services:

 #ARTICLE-SERVICE

  article-service:
    image: article-service
    ports:
      - "8080:8080"
    deploy:
      replicas: 3

  article-cache:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  article-queue:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"

  article-db-global:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ArticleDatabase
    volumes:
      - article-db-global-data:/var/lib/postgresql
    ports:
    - "5432:5432"

  article-db-europe:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ArticleDatabase
    volumes:
      - article-db-europe-data:/var/lib/postgresql
    ports:
    - "5433:5432"

  article-db-asia:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ArticleDatabase
    volumes:
      - article-db-asia-data:/var/lib/postgresql
    ports:
    - "5434:5432"

  article-db-africa:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ArticleDatabase
    volumes:
      - article-db-africa-data:/var/lib/postgresql
    ports:
    - "5435:5432"

  article-db-north-america:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ArticleDatabase
    volumes:
      - article-db-north-america-data:/var/lib/postgresql
    ports:
    - "5436:5432"

  article-db-south-america:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ArticleDatabase
    volumes:
      - article-db-south-america-data:/var/lib/postgresql
    ports:
    - "5437:5432"

  article-db-australia:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ArticleDatabase
    volumes:
      - article-db-australia-data:/var/lib/postgresql
    ports:
    - "5438:5432"

  article-db-antarctica:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ArticleDatabase
    volumes:
      - article-db-antarctica-data:/var/lib/postgresql
    ports:
    - "5439:5432"


 #COMMENT-SERVICE

  comment-service:
    image: comment-service
    ports:
      - "8081:8080"

  comment-cache:
    image: redis:8-alpine
    ports:
      - "6380:6379"

  comment-db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: CommentDatabase
    volumes:
      - comment-db-data:/var/lib/postgresql
    ports:
      - "5532:5432"


 #PROFANITY-SERVICE

  profanity-service:
    image: profanity-service
    ports:
      - "8082:8080"

  profanity-db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ProfanityDatabase
    volumes:
      - profanity-db-data:/var/lib/postgresql
    ports:
      - "5632:5432"


 #DRAFT-SERVICE

  draft-service:
    image: draft-service
    ports:
      - "8083:8080"

  draft-db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: DraftDatabase
    volumes:
      - draft-db-data:/var/lib/postgresql
    ports:
      - "5732:5432"


 #PUBLISHER-SERVICE

  publisher-service:
    image: publisher-service
    ports:
      - "8084:8080"


 #NEWSLETTER-SERVICE

  newsletter-service:
    image: newsletter-service
    ports:
      - "8085:8080"


volumes:
  article-db-europe-data:
  article-db-asia-data:
  article-db-africa-data:
  article-db-north-america-data:
  article-db-south-america-data:
  article-db-australia-data:
  article-db-antarctica-data:
  article-db-global-data:
  comment-db-data:
  profanity-db-data:
  draft-db-data: