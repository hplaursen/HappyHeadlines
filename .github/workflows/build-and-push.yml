name: Build and publish Docker images

on:
  push:
    branches: 
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: ArticleService
            image: happyheadlines-article-service
          - service: CommentService
            image: happyheadlines-comment-service
          - service: DraftService
            image: happyheadlines-draft-service
          - service: ProfanityService
            image: happyheadlines-profanity-service
          - service: PublisherService
            image: happyheadlines-publisher-service
          - service: NewsletterService
            image: happyheadlines-newsletter-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
