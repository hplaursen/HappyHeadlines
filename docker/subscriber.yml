services:
  subscriber-db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: SubscriberDatabase
    volumes:
      - subscriber-db-data:/var/lib/postgresql
    networks:
      - subscriber-internal

  subscriber-queue:
    image: rabbitmq:4-management
    volumes:
      - subscriber-queue-data:/var/lib/rabbitmq
    networks:
      - subscriber-internal

  subscriber-service:
    image: subscriber-service
    ports:
      - "8086:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    networks:
      - happyheadlines
      - subscriber-internal
    deploy:
      replicas: 2

volumes:
  subscriber-db-data:
  subscriber-queue-data:

networks:
  happyheadlines:
    external: true
  subscriber-internal:
    name: subscriber-internal
