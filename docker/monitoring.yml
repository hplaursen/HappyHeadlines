services:

  seq:
    image: datalust/seq
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"
      - "5342:80"
    volumes:
      - seq-db-data:/data
    networks:
      - happyheadlines

  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    volumes:
      - zipkin-db-data:/data
    networks:
      - happyheadlines

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - happyheadlines

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - happyheadlines


volumes:
  seq-db-data:
  zipkin-db-data:
  prometheus-data:
  grafana-data:

networks:
  happyheadlines:
    external: true